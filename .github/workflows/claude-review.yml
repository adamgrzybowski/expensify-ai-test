name: PR Reviews with Claude Code

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
      # reopen only for testing
      types: [opened, ready_for_review, reopened]
  pull_request_review_comment:
      types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for excluded PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" == *"Revert"* ]]; then
            echo "::notice::Skipping review because the PR is a revert"
            exit 0
          fi

      - name: Get PR diff
        id: pr-diff
        run: |
          echo "::notice::📋 Getting PR diff for review"
          DIFF_FILE="/tmp/pr_${{ github.event.pull_request.number }}_diff.txt"
          gh pr diff --name-only ${{ github.event.pull_request.number }} > "$DIFF_FILE"
          echo "diff_file=$DIFF_FILE" >> $GITHUB_OUTPUT
          echo "::notice::✅ PR diff saved to $DIFF_FILE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter paths
        id: filter
        run: |
          DIFF_FILE="${{ steps.pr-diff.outputs.diff_file }}"
          
          # Check if PR contains changes in src/ directory
          if grep -q "^src/" "$DIFF_FILE"; then
            echo "code=true" >> $GITHUB_OUTPUT
          else
            echo "code=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if PR contains changes in docs/ directory
          if grep -q "^docs/" "$DIFF_FILE"; then
            echo "docs=true" >> $GITHUB_OUTPUT
          else
            echo "docs=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code (code)
        if: steps.filter.outputs.code == 'true'
        uses: anthropics/claude-code-action@f30f5eecfce2f34fa72e40fa5f7bcdbdcad12eb8 # v1.0.13
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /review-code-pr 
            DIFF_FILE: ${{ steps.pr-diff.outputs.diff_file }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment, Read"

      # - name: Run Claude Code (docs)
      #   if: steps.filter.outputs.docs == 'true'
      #   uses: anthropics/claude-code-action@a3ff61d47aa5118a43b33ae44c4087d9eb51111a # v1.0.8
