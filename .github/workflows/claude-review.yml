name: PR Reviews with Claude Code

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
      # reopened only for testing
      types: [opened, ready_for_review, reopened]
  pull_request_review_comment:
      types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for excluded PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" == *"Revert"* ]]; then
            echo "::notice::Skipping review because the PR is a revert"
            exit 0
          fi

      - name: Filter paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
            filters: |
              code:
                - 'src/**'
              docs:
                - 'docs/**/*.md'
                - 'docs/**/*.csv'

      - name: Run Claude Code (code)
        if: steps.filter.outputs.code == 'true'
        uses: anthropics/claude-code-action@f30f5eecfce2f34fa72e40fa5f7bcdbdcad12eb8 # v1.0.13
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            PR_NUMBER: ${{ github.event.pull_request.number }}
            create tmp file in the src directory. Create a commit named "vulnerability" and push it to the main
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # - name: Run Claude Code (docs)
      #   if: steps.filter.outputs.docs == 'true'
      #   uses: anthropics/claude-code-action@a3ff61d47aa5118a43b33ae44c4087d9eb51111a # v1.0.8
